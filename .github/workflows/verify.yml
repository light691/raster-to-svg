name: Verify portable skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix scripts --no-audit --no-fund
      - run: python scripts/doctor.py
      - run: python tests/smoke.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix scripts --no-audit --no-fund
      - run: npm ci --prefix optional-skills/playwright-svg-verification/scripts --no-audit --no-fund
      - run: node optional-skills/playwright-svg-verification/scripts/node_modules/playwright/cli.js install --with-deps chromium
      - run: python scripts/doctor.py --playwright
      - run: python tests/smoke.py --playwright
